<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Tracker</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="app">

    <!-- ============================== TODAY ============================== -->
    <section id="view-today" class="view active" aria-label="Today">
      <header class="cal" id="cal" aria-label="Recent and upcoming days"></header>

      <div class="status" id="status"></div>

      <div class="timer-wrap">
        <button class="ring" id="ring" aria-label="Timer">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <circle class="ring-track" cx="100" cy="100" r="88"></circle>
            <circle class="ring-fill" id="ring-fill" cx="100" cy="100" r="88"></circle>
          </svg>
          <div class="ring-inner">
            <div class="ring-time" id="time">03:00</div>
            <div class="ring-caption" id="caption">Tap to start</div>
          </div>
        </button>
      </div>

      <div class="controls">
        <button class="btn primary" id="primary">Start</button>
        <button class="btn ghost" id="secondary" hidden>Skip rest</button>
      </div>

      <section class="plan" aria-label="Today's plan">
        <div class="plan-chips" id="plan-chips"></div>
        <div class="pips" id="pips"></div>
        <div class="plan-sub" id="plan-sub"></div>
      </section>

      <div class="minor-actions">
        <button class="link" id="undo-count" hidden>Discount last count</button>
        <button class="link danger" id="skip-today" hidden>Skip today</button>
        <button class="link danger" id="reset-session" hidden>Reset session</button>
      </div>
    </section>

    <!-- ============================== HISTORY ============================ -->
    <section id="view-history" class="view" aria-label="History">
      <h1>History</h1>
      <div class="tiles" id="history-tiles"></div>
      <div class="row-actions">
        <button class="btn small" id="export-json">Export JSON</button>
        <button class="btn small" id="export-csv">Export CSV</button>
        <label class="btn small file">Import JSON<input type="file" id="import-json" accept="application/json,.json"></label>
        <button class="btn small" id="record-day">Record a day</button>
      </div>
      <div class="day-list" id="day-list"></div>
    </section>

    <!-- ============================== SETTINGS =========================== -->
    <section id="view-settings" class="view" aria-label="Settings">
      <h1>Settings</h1>
      <div id="settings-form"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Views">
    <button class="tab active" data-view="today">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9v4l2.5 2.5M9 2h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Today</span>
    </button>
    <button class="tab" data-view="history">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>History</span>
    </button>
    <button class="tab" data-view="settings">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="7" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="8" cy="17" r="2" fill="currentColor"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
